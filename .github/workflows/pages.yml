name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "bus_to_seoul/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  schedule:
    # 한국 시간 10~23시 사이에 매분 수집하고 즉시 Pages에 배포한다.
    - cron: "* 1-14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh live data and SQLite
        env:
          BUS_DB: ${{ github.workspace }}/data/bus.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m bus_to_seoul collect
          python -m bus_to_seoul export-static
      - name: Commit refreshed data
        run: |
          mkdir -p /tmp/bus-refresh/site/data /tmp/bus-refresh/logs
          cp data/bus.db /tmp/bus-refresh/bus.db
          cp site/data/live.json /tmp/bus-refresh/site/data/live.json
          cp site/data/stats.json /tmp/bus-refresh/site/data/stats.json
          cp logs/collector.log /tmp/bus-refresh/logs/collector.log
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bus-refresh/bus.db data/bus.db
            cp /tmp/bus-refresh/site/data/live.json site/data/live.json
            cp /tmp/bus-refresh/site/data/stats.json site/data/stats.json
            cp /tmp/bus-refresh/logs/collector.log logs/collector.log
            git add data/bus.db site/data logs/collector.log
            if git diff --quiet --cached; then
              git push origin main && exit 0
            elif git commit -m "Refresh bus data [skip ci]" && git push origin main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
        env:
          WAIT_FOR_ARTIFACT_SECONDS: 30
      - name: Wait for GitHub Pages artifact
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
